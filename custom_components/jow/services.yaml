  fields:
    ingredient:
      name: Ingrédient
      required: true
      selector:
        text:
    action:
      name: Action
      description: add = ajouter à la liste noire, remove = retirer de la liste noire.
      default: add
      selector:
        select:
          options: [add, remove]
    entry_name:
      name: Instance Jow
      description: Nom de l'instance Jow à utiliser (si plusieurs configurées). Laisser vide pour l'instance par défaut.
      selector:
        text:

import_menu:
