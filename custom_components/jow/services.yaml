plan_meal:
  name: Planifier un repas
  description: >-
    Épingle une recette sur un jour. Avec recipe_id (id Jow exact, ex. un
    favori) : épingle directement cette recette. Sinon : recherche par
    query et prend le résultat n° choice.
  fields:
    query:
      name: Recherche
      required: true
      example: poulet curry coco
      selector:
        text:
    recipe_id:
      name: ID de recette (exact)
      description: >-
        Id Jow de la recette à épingler directement (ex. un favori) —
        ignore la recherche par titre. Si la recette est introuvable,
        repli sur la recherche query.
      selector:
        text:
    entry_name:
      name: Instance Jow
      description: Nom de l'instance Jow à utiliser (si plusieurs configurées). Laisser vide pour l'instance par défaut.
      selector:
        text:
    weekday:
      name: Jour
      selector:
        select:
          options: [lundi, mardi, mercredi, jeudi, vendredi, samedi, dimanche]
    date:
      name: Date précise
      description: Prioritaire sur le jour de la semaine.
      selector:
        date:
    week_offset:
      name: Décalage de semaine
      description: 0 = semaine en cours, 1 = semaine prochaine.
      default: 0
      selector:
        number:
          min: -4
          max: 8
    covers:
      name: Couverts
      selector:
        number:
          min: 1
          max: 12
    choice:
      name: Résultat à retenir
      description: 1 = premier résultat de la recherche.
      default: 1
      selector:
        number:
          min: 1
          max: 10

