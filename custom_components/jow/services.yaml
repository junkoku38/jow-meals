suggest:
  name: Suggérer des recettes par IA
  description: >-
    Pipeline complet : 1) l'agent ia_task formule une requête de recherche
    adaptée (allergies, préférences, météo), 2) Jow est interrogé sur 100
    résultats, 3) filtres (interdits, anti-répétition) et re-ranking
    lexical, 4) l'agent ia_task choisit la recette la plus adaptée à la
    demande parmi les candidates. Si weekday est fourni, planifie
    automatiquement le résultat choisi sur ce jour.
  fields:
    criteria:
      name: Demande
      description: Demande libre (ex. "plat frais pour canicule", "dîner léger").
      selector:
        text:
    ai_prompt:
      name: Invite IA
      description: >-
        Surcharge partielle ou totale de l'invite envoyée à l'agent IA
        (avancé — laisser vide pour l'invite par défaut).
      selector:
        text:
    entry_name:
      name: Instance Jow
      description: Nom de l'instance Jow à utiliser (si plusieurs configurées). Laisser vide pour l'instance par défaut.
      selector:
        text:
    weekday:
      name: Jour de la semaine
      description: Si fourni, planifie le premier résultat sur ce jour (écrase un repas existant, sauf si overwrite est à false).
      selector:
        select:
          options: [lundi, mardi, mercredi, jeudi, vendredi, samedi, dimanche]
    overwrite:
      name: Écraser le repas existant
      description: >-
        true (défaut) : remplace le repas déjà planifié sur le jour cible —
        comportement attendu du bouton « Changer de recette ». false : ne
        planifie pas si le jour est déjà occupé (utile en automation).
      default: true
      selector:
        boolean:
    max_calories:
      name: Calories maximum
      description: >-
        Contrainte forte sur le choix final : la recette planifiée doit
        faire au plus ce nombre de kcal par personne. L'agent de sélection
        la reçoit aussi comme instruction ; le choix est vérifié en dur
        après récupération des calories (avec recherche d'alternative
        conforme si nécessaire).
      selector:
        number:
          min: 100
          max: 2000
          step: 10
          unit_of_measurement: kcal
    max_total_time:
      name: Temps total maximum
      description: >-
        Filtre dur appliqué avant la sélection : les recettes dont
        préparation + cuisson dépasse cette durée (minutes) sont écartées.
        Si aucune ne convient, le filtre est ignoré (loggué).
      selector:
        number:
          min: 5
          max: 240
          step: 5
          unit_of_measurement: min
    limit:
      name: Nombre de résultats
      default: 5
      selector:
        number:
          min: 1
          max: 20
    covers:
      name: Couverts
      selector:
        number:
          min: 1
          max: 12
    weather_entity:
      name: Capteur météo
      description: Entité weather.* pour contextualiser (ex. weather.maison).
      selector:
        entity:
          domain: weather
    ai_entity:
      name: Agent IA
      description: Entité ai_task.* pour générer la requête (ex. ai_task.ollama_ai_task).
      selector:
        entity:
          domain: ai_task
    week_offset:
      name: Décalage de semaine
      description: 0 = semaine en cours, 1 = semaine prochaine.
      default: 0
      selector:
        number:
          min: -4
          max: 8

