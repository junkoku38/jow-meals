  name: Ajouter une recette à des collections
  description: >-
    Ajoute une recette à une ou plusieurs collections Jow. La recette
    vient soit de recipe_id (id Jow exact), soit du jour du planning HA
    (weekday/week_offset) — « mets le plat de mardi dans ma collection ».
  fields:
    collections:
      name: Collections (ids)
      description: Ids des collections cibles (voir collections_list).
      required: true
      example: '["6a976bd7f75cc27fbbfafec1"]'
      selector:
        object:
    recipe_id:
      name: ID de recette
      description: Id Jow de la recette (sinon, utiliser weekday).
      selector:
        text:
    weekday:
      name: Jour du planning
      description: Prend le plat planifié ce jour-là dans HA.
      selector:
        select:
          options: [lundi, mardi, mercredi, jeudi, vendredi, samedi, dimanche]
    week_offset:
      name: Décalage de semaine
      default: 0
      selector:
        number:
          min: -4
          max: 8
    entry_name:
      name: Instance Jow
      selector:
        text:

collection_import:
  name: Importer une collection
  description: >-
    Planifie les recettes d'une collection Jow sur la semaine visée.
    Par défaut : jours vides seulement. overwrite: true remplace les
    repas existants (les anciens sont mémorisés comme rejets).
  fields:
    collection_id:
      name: ID de collection
      required: true
      selector:
        text:
    overwrite:
      name: Remplacer la semaine
      description: >-
        true : vide la semaine visée (repas remplacés mémorisés comme
        rejets) avant d'appliquer la collection. false : jours vides
        seulement.
      default: false
      selector:
        boolean:
    week_offset:
      name: Décalage de semaine
      default: 0
      selector:
        number:
          min: -4
          max: 8
    entry_name:
      name: Instance Jow
      selector:
        text:

uploaded_recipes:
  name: Mes recettes maison Jow
  description: >-
    Liste les recettes maison du compte (celles créées via l'app mobile
    Jow — l'API web ne permet pas de les créer). Elles peuvent ensuite
    être planifiées via plan_meal avec leur recipe_id.
  fields:
    entry_name:
      name: Instance Jow
      selector:
        text:


import_token:
  name: Importer un token marchand (script jow-marchand)
  description: >-
    Utilisé par le script scripts/jow_marchand.py : importe le refresh
    token (et le cookie JowSession) capturés lors du login enseigne en
    navigateur réel (MFA saisi manuellement). La session magasin devient
    celle de HA immédiatement. À ne pas appeler à la main sauf si vous
    savez ce que vous faites.
  fields:
    refresh_token:
      name: Refresh token
      required: true
      selector:
        text:
    session_cookie:
      name: Cookie JowSession (optionnel)
      selector:
        text:
    entry_name:
      name: Instance Jow
      selector:
        text:

reset_rejects:
  name: Vider la mémoire des rejets
  description: >-
    Vide la liste des plats mémorisés comme refusés (60 jours d'origine).
    Utile quand des effacements en bloc (semaines vidées d'une traite,
    tests) ont marqué « refusés » des plats jamais réellement rejetés :
    l'import de menu et les suggestions redeviennent libres de les
    proposer. L'anti-répétition des repas MANGÉS (4 semaines) est
    conservée.
  fields:
    entry_name:
      name: Instance Jow
      selector:
        text:

export_week:
  name: Exporter la semaine vers jow.fr
  description: >-
    Livre le planning de la semaine dans une collection jow.fr (« Semaine
    N » par défaut, ou titre personnalisé). La collection est vidée puis
    remplie à chaque export — dans l'app jow, ouvrez la collection dans le
    cookbook et ajoutez les recettes au menu quand vous faites votre liste
    d'achat. Home Assistant reste la source du planning.
  fields:
    week_offset:
      name: Décalage de semaine
      description: 0 = semaine en cours, 1 = semaine prochaine.
      default: 0
      selector:
        number:
          min: -4
          max: 8
    title:
      name: Titre de la collection
      description: 'Par défaut « Semaine N » (numéro ISO de la semaine visée).'
      selector:
        text:
    is_private:
      name: Privée
      default: true
      selector:
        boolean:
    entry_name:
      name: Instance Jow
      selector:
        text:
