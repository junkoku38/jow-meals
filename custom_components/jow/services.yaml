    Sens inverse de send_menu : récupère le menu de la semaine depuis le
    compte Jow (plats ajoutés sur jow.fr ou l'app mobile) et les épingle
    sur les jours vides du planning HA. Les jours déjà planifiés en HA
    ne sont jamais écrasés. L'endpoint Jow est capricieux : le rapport
    détaillé (imported / skipped / error) dit tout.
  fields:
    week_offset:
      name: Décalage de semaine
      description: 0 = semaine en cours, 1 = semaine prochaine.
      default: 0
      selector:
        number:
          min: -4
          max: 8
    entry_name:
      name: Instance Jow
      description: Nom de l'instance Jow à utiliser (si plusieurs configurées). Laisser vide pour l'instance par défaut.
      selector:
        text:

expiring:
