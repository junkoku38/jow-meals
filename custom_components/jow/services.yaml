plan_meal:
  name: Planifier un repas
  description: >-
    Épingle une recette sur un jour. Avec recipe_id (id Jow exact, ex. un
    favori) : épingle directement cette recette. Sinon : recherche par
    query et prend le résultat n° choice.
  fields:
    query:
      name: Recherche
      required: true
      example: poulet curry coco
      selector:
        text:
    recipe_id:
      name: ID de recette (exact)
      description: >-
        Id Jow de la recette à épingler directement (ex. un favori) —
        ignore la recherche par titre. Si la recette est introuvable,
        repli sur la recherche query.
      selector:
        text:
    entry_name:
      name: Instance Jow
      description: Nom de l'instance Jow à utiliser (si plusieurs configurées). Laisser vide pour l'instance par défaut.
      selector:
        text:
    weekday:
      name: Jour
      selector:
        select:
          options: [lundi, mardi, mercredi, jeudi, vendredi, samedi, dimanche]
    date:
      name: Date précise
      description: Prioritaire sur le jour de la semaine.
      selector:
        date:
    week_offset:
      name: Décalage de semaine
      description: 0 = semaine en cours, 1 = semaine prochaine.
      default: 0
      selector:
        number:
          min: -4
          max: 8
    covers:
      name: Couverts
      selector:
        number:
          min: 1
          max: 12
    choice:
      name: Résultat à retenir
      description: 1 = premier résultat de la recherche.
      default: 1
      selector:
        number:
          min: 1
          max: 10

clear_meal:
  name: Effacer un repas
  fields:
    weekday:
      selector:
        select:
          options: [lundi, mardi, mercredi, jeudi, vendredi, samedi, dimanche]
    date:
      selector:
        date:
    week_offset:
      default: 0
      selector:
        number:
          min: -4
          max: 8
    entry_name:
      name: Instance Jow
      description: Nom de l'instance Jow à utiliser (si plusieurs configurées). Laisser vide pour l'instance par défaut.
      selector:
        text:

clear_week:
  name: Effacer la semaine
  description: >-
    Efface les 7 repas de la semaine visée. Les plats effacés sont
    mémorisés comme rejets (l'anti-répétition les évite 60 jours) —
    désactivable via remember_rejects: false.
  fields:
    week_offset:
      default: 0
      selector:
        number:
          min: -4
          max: 8
    remember_rejects:
      name: Mémoriser comme rejets
      description: >-
        true (défaut) : les plats effacés en bloc ne seront pas
        reproposés par les suggestions pendant 60 jours. false : simple
        effacement, les plats restent éligibles.
      default: true
      selector:
        boolean:
    entry_name:
      name: Instance Jow
      description: Nom de l'instance Jow à utiliser (si plusieurs configurées). Laisser vide pour l'instance par défaut.
      selector:
        text:

renew_week:
  name: Renouveler la semaine
  description: >-
    Vide la semaine (plats mémorisés comme rejets) puis la replanifie
    entièrement via le pipeline IA : requête contextualisée, recherche
    100 résultats, filtres (interdits, anti-répétition, familles),
    sélection IA. Idéal pour « change-moi toute la semaine ».
  fields:
    week_offset:
      default: 0
      selector:
        number:
          min: -4
          max: 8
    criteria:
      name: Critère global
      description: 'Critère de base pour tous les jours (ex : "plat varié équilibré").'
      default: plat varié équilibré
      selector:
        text:
    day_criteria:
      name: Critères par jour
      description: >-
        Surcharge le critère pour des jours précis. Ex :
        { "vendredi": "plaisir", "dimanche": "plat familial" }.
      selector:
        object:
    covers:
      name: Couverts
      selector:
        number:
          min: 1
          max: 12
    weather_entity:
      name: Entité météo
      selector:
        entity:
          domain: weather
    ai_entity:
      name: Agent IA
      selector:
        entity:
          domain: ai_task
    ai_prompt:
      name: Invite IA
      description: Surcharge partielle ou totale de l'invite (avancé).
      selector:
        text:
    max_calories:
      name: Calories maximum
      description: Contrainte forte sur le plat planifié (kcal/pers, vide = aucune).
      selector:
        number:
          min: 100
          max: 2000
          step: 10
          unit_of_measurement: kcal
    max_total_time:
      name: Temps total maximum
      description: Filtre dur avant sélection (minutes, vide = aucun).
      selector:
        number:
          min: 5
          max: 240
          step: 5
          unit_of_measurement: min
    entry_name:
      name: Instance Jow
      description: Nom de l'instance Jow à utiliser (si plusieurs configurées). Laisser vide pour l'instance par défaut.
      selector:
        text:

refresh_shopping_list:
  name: Régénérer la liste de courses
  fields:
    week_offset:
      default: 0
      selector:
        number:
          min: -4
          max: 8
    keep_checked:
      name: Conserver les articles cochés
      default: true
      selector:
        boolean:
    entry_name:
      name: Instance Jow
      description: Nom de l'instance Jow à utiliser (si plusieurs configurées). Laisser vide pour l'instance par défaut.
      selector:
        text:

search:
  name: Rechercher une recette
  description: Renvoie les recettes trouvées (utile pour un agent conversationnel).
  fields:
    query:
      required: true
      selector:
        text:
    limit:
      default: 5
      selector:
        number:
          min: 1
          max: 20
    covers:
      selector:
        number:
          min: 1
          max: 12
    entry_name:
      name: Instance Jow
      description: Nom de l'instance Jow à utiliser (si plusieurs configurées). Laisser vide pour l'instance par défaut.
      selector:
        text:

suggest:
  name: Suggérer des recettes par IA
  description: >-
    Pipeline complet : 1) l'agent ia_task formule une requête de recherche
    adaptée (allergies, préférences, météo), 2) Jow est interrogé sur 100
    résultats, 3) filtres (interdits, anti-répétition) et re-ranking
    lexical, 4) l'agent ia_task choisit la recette la plus adaptée à la
    demande parmi les candidates. Si weekday est fourni, planifie
    automatiquement le résultat choisi sur ce jour.
  fields:
    criteria:
      name: Demande
      description: Demande libre (ex. "plat frais pour canicule", "dîner léger").
      selector:
        text:
    ai_prompt:
      name: Invite IA
      description: >-
        Surcharge partielle ou totale de l'invite envoyée à l'agent IA
        (avancé — laisser vide pour l'invite par défaut).
      selector:
        text:
    entry_name:
      name: Instance Jow
      description: Nom de l'instance Jow à utiliser (si plusieurs configurées). Laisser vide pour l'instance par défaut.
      selector:
        text:
    weekday:
      name: Jour de la semaine
      description: Si fourni, planifie le premier résultat sur ce jour (écrase un repas existant, sauf si overwrite est à false).
      selector:
        select:
          options: [lundi, mardi, mercredi, jeudi, vendredi, samedi, dimanche]
    overwrite:
      name: Écraser le repas existant
      description: >-
        true (défaut) : remplace le repas déjà planifié sur le jour cible —
        comportement attendu du bouton « Changer de recette ». false : ne
        planifie pas si le jour est déjà occupé (utile en automation).
      default: true
      selector:
        boolean:
    max_calories:
      name: Calories maximum
      description: >-
        Contrainte forte sur le choix final : la recette planifiée doit
        faire au plus ce nombre de kcal par personne. L'agent de sélection
        la reçoit aussi comme instruction ; le choix est vérifié en dur
        après récupération des calories (avec recherche d'alternative
        conforme si nécessaire).
      selector:
        number:
          min: 100
          max: 2000
          step: 10
          unit_of_measurement: kcal
    rescue_expiry:
      name: Sauver les ingrédients qui expirent
      description: >-
        Injecte en priorité dans le contexte IA les ingrédients périssables
        du planning qui expirent sous 3 jours (viandes, crèmerie, légumes
        frais) — la recette générée doit les écouler en priorité.
      default: false
      selector:
        boolean:
    max_total_time:
      name: Temps total maximum
      description: >-
        Filtre dur appliqué avant la sélection : les recettes dont
        préparation + cuisson dépasse cette durée (minutes) sont écartées.
        Si aucune ne convient, le filtre est ignoré (loggué).
      selector:
        number:
          min: 5
          max: 240
          step: 5
          unit_of_measurement: min
    limit:
      name: Nombre de résultats
      default: 5
      selector:
        number:
          min: 1
          max: 20
    covers:
      name: Couverts
      selector:
        number:
          min: 1
          max: 12
    weather_entity:
      name: Capteur météo
      description: Entité weather.* pour contextualiser (ex. weather.maison).
      selector:
        entity:
          domain: weather
    ai_entity:
      name: Agent IA
      description: Entité ai_task.* pour générer la requête (ex. ai_task.ollama_ai_task).
      selector:
        entity:
          domain: ai_task
    week_offset:
      name: Décalage de semaine
      description: 0 = semaine en cours, 1 = semaine prochaine.
      default: 0
      selector:
        number:
          min: -4
          max: 8

