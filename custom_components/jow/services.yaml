plan_meal:
  name: Planifier un repas
  description: Recherche une recette sur Jow et l'épingle sur un jour.
  fields:
    query:
      name: Recherche
      required: true
      example: poulet curry coco
      selector:
        text:
    weekday:
      name: Jour
      selector:
        select:
          options: [lundi, mardi, mercredi, jeudi, vendredi, samedi, dimanche]
    date:
      name: Date précise
      description: Prioritaire sur le jour de la semaine.
      selector:
        date:
    week_offset:
      name: Décalage de semaine
      description: 0 = semaine en cours, 1 = semaine prochaine.
      default: 0
      selector:
        number:
          min: -4
          max: 8
    covers:
      name: Couverts
      selector:
        number:
          min: 1
          max: 12
    choice:
      name: Résultat à retenir
      description: 1 = premier résultat de la recherche.
      default: 1
      selector:
        number:
          min: 1
          max: 10

clear_meal:
  name: Effacer un repas
  fields:
    weekday:
      selector:
        select:
          options: [lundi, mardi, mercredi, jeudi, vendredi, samedi, dimanche]
    date:
      selector:
        date:
    week_offset:
      default: 0
      selector:
        number:
          min: -4
          max: 8

clear_week:
  name: Effacer la semaine
  fields:
    week_offset:
      default: 0
      selector:
        number:
          min: -4
          max: 8

refresh_shopping_list:
  name: Régénérer la liste de courses
  fields:
    week_offset:
      default: 0
      selector:
        number:
          min: -4
          max: 8
    keep_checked:
      name: Conserver les articles cochés
      default: true
      selector:
        boolean:

search:
  name: Rechercher une recette
  description: Renvoie les recettes trouvées (utile pour un agent conversationnel).
  fields:
    query:
      required: true
      selector:
        text:
    limit:
      default: 5
      selector:
        number:
          min: 1
          max: 20
    covers:
      selector:
        number:
          min: 1
          max: 12

suggest:
  name: Suggérer des recettes par IA
  description: >-
    Génère une requête de recherche adaptée aux allergies, préférences et
    météo via un agent ai_task, puis renvoie les recettes Jow correspondantes.
    Si weekday est fourni, planifie automatiquement le premier résultat sur ce jour.
  fields:
    criteria:
      name: Demande
      description: Demande libre (ex. "plat frais pour canicule", "dîner léger").
      selector:
        text:
    weekday:
      name: Jour de la semaine
      description: Si fourni, planifie le premier résultat sur ce jour.
      selector:
        select:
          options: [lundi, mardi, mercredi, jeudi, vendredi, samedi, dimanche]
    limit:
      name: Nombre de résultats
      default: 5
      selector:
        number:
          min: 1
          max: 20
    covers:
      name: Couverts
      selector:
        number:
          min: 1
          max: 12
    weather_entity:
      name: Capteur météo
      description: Entité weather.* pour contextualiser (ex. weather.maison).
      selector:
        entity:
          domain: weather
    ai_entity:
      name: Agent IA
      description: Entité ai_task.* pour générer la requête (ex. ai_task.ollama_ai_task).
      selector:
        entity:
          domain: ai_task

sync_profile:
  name: Synchroniser le profil Jow
  description: Récupère le profil du compte Jow connecté (nom, email, foyer, habitudes).

sync_favorites:
  name: Synchroniser les favoris Jow
  description: Récupère les recettes favorites du compte Jow connecté.

sync_preferences:
  name: Synchroniser les préférences Jow
  description: >-
    Récupère les habitudes alimentaires et ingrédients exclus depuis le compte
    Jow et les utilise pour filtrer les suggestions de recettes.

meal_done:
  name: Marquer un repas comme fait
  description: >-
    Marque le repas d'un jour comme terminé, retire ses ingrédients de la
    liste de courses et supprime le repas du planning.
  fields:
    weekday:
      name: Jour de la semaine
      selector:
        select:
          options: [lundi, mardi, mercredi, jeudi, vendredi, samedi, dimanche]
    date:
      name: Date exacte
      selector:
        date: {}
    week_offset:
      name: Décalage de semaine
      default: 0
      selector:
        number:
          min: -4
          max: 4

sync_calories:
  name: Synchroniser les calories
  description: >-
    Récupère les calories par portion manquantes pour tous les repas planifiés
    de la semaine en interrogeant l'API Jow.
  fields:
    week_offset:
      name: Décalage de semaine
      default: 0
      selector:
        number:
          min: -4
          max: 8
