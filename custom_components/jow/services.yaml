  fields:
    week_offset:
      name: Décalage de semaine
      description: 0 = semaine en cours, 1 = semaine prochaine.
      default: 0
      selector:
        number:
          min: -4
          max: 8
    entry_name:
      name: Instance Jow
      description: Nom de l'instance Jow à utiliser (si plusieurs configurées). Laisser vide pour l'instance par défaut.
      selector:
        text:

