[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
]
ignore = [
    "E501",  # lignes longues autorisées jusqu'à 120 (couvert par line-length)
]

[tool.ruff.lint.isort]
force-sort-within-sections = true